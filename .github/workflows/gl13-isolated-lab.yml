name: GL-13 Windows isolated lab

on:
  push:
    branches: [test/gl13-phase2-runner]

permissions:
  contents: read

jobs:
  gl13:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build regression project
        run: dotnet build Nguon/tests/PersonalInfoManager.SecurityRegression.csproj --configuration Release
      - name: Run GL-13 with synthetic data
        shell: pwsh
        env:
          TQLTK_GL13_JUNCTION_TEST: '1'
        run: |
          $testRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [System.IO.Directory]::Exists($testRoot)) { throw 'RUNNER_TEMP is unavailable.' }
          $env:TEMP = $testRoot
          $env:TMP = $testRoot
          $report = Join-Path $testRoot 'gl13-report.xml'
          dotnet run --no-build --project Nguon/tests/PersonalInfoManager.SecurityRegression.csproj --configuration Release -- --gl13 $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content -LiteralPath $report -Raw
          if ($results.DocumentElement.LocalName -ne 'testsuite' -or @($results.DocumentElement.Attributes | Where-Object { $_.LocalName -notin @('name','tests','failures','skipped') }).Count -ne 0 -or @($results.DocumentElement.ChildNodes | Where-Object { $_.LocalName -ne 'testcase' }).Count -ne 0) { throw 'Unexpected JUnit structure.' }
          $cases = @($results.testsuite.testcase)
          $requiredCases = @('junction-detection-cleanup', 'migration-stale-observation-existing-destination', 'migration-child-after-move-retry', 'vault-backup-move-failure-retry', 'vault-backup-destination-collision', 'vault-backup-between-moves-interruption')
          if ($results.testsuite.name -ne 'TQLTK.Windows.GL13' -or $cases.Count -ne 26 -or @($requiredCases | Where-Object { $required = $_; @($cases | Where-Object { $_.name -eq $required }).Count -ne 1 }).Count -ne 0 -or [int]$results.testsuite.tests -ne $cases.Count -or [int]$results.testsuite.failures -ne 0 -or [int]$results.testsuite.skipped -ne 0) { throw 'Invalid or unsuccessful GL-13 report.' }
          foreach ($case in $cases) {
            if ($case.classname -ne 'TQLTK.Windows.GL13' -or $case.name -notmatch '^[a-z0-9-]+$' -or $case.ChildNodes.Count -ne 0 -or @($case.Attributes | Where-Object { $_.LocalName -notin @('name','classname') }).Count -ne 0) { throw 'Unexpected JUnit content.' }
          }
      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: gl13-isolated-junit
          path: ${{ runner.temp }}/gl13-report.xml
          if-no-files-found: error
