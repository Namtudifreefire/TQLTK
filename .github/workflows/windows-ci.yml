name: TQLTK Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Nguon/PersonalInfoManager.csproj --configuration Release

      - name: Run security regression checks
        shell: pwsh
        run: ./ci/run-windows-security.ps1

      - name: Windows GL-09 backup path and DPAPI checks
        shell: pwsh
        run: ./ci/run-windows-security.ps1 -BackupLabMode windows-paths -LabPath "$env:GITHUB_WORKSPACE/artifacts/windows-gl09/junit.xml"

      - name: Upload Windows GL-09 JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gl09-junit
          path: artifacts/windows-gl09/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Windows GL-11 backup log privacy
        shell: pwsh
        run: ./ci/run-windows-security.ps1 -BackupLabMode log-privacy -LabPath "$env:GITHUB_WORKSPACE/artifacts/windows-gl11/junit.xml"

      - name: Upload Windows GL-11 JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gl11-junit
          path: artifacts/windows-gl11/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Confirm fault injection hooks are absent from production build
        shell: pwsh
        run: |
          $assembly = 'Nguon/bin/Release/net10.0-windows10.0.19041.0/PersonalInfoManager.dll'
          if (-not (Test-Path -LiteralPath $assembly)) { throw 'Production assembly not found.' }
          $metadata = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $assembly)))
          if ($metadata.Contains('RestoreTestCheckpoint')) { throw 'Test checkpoint leaked into production build.' }
          Write-Output 'PASS production assembly excludes backup fault-injection checkpoint.'

      - name: Backup restore with rollback failure
        shell: pwsh
        run: ./ci/run-windows-security.ps1 -BackupLabMode rollback

      - name: Backup restore after process termination
        shell: pwsh
        run: ./ci/run-windows-security.ps1 -BackupLabMode crash

      - name: Publish Windows x64
        if: github.event_name != 'pull_request'
        run: dotnet publish Nguon/PersonalInfoManager.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish

      - name: Package app
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/package -Force | Out-Null
          Copy-Item artifacts/publish/PersonalInfoManager.exe artifacts/package/
          Copy-Item Nguon/LICENSE artifacts/package/LICENSE
          Compress-Archive -Path artifacts/package/* -DestinationPath artifacts/TQLTK-win-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: TQLTK-win-x64
          path: artifacts/TQLTK-win-x64.zip
          if-no-files-found: error

  gl13:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build regression project
        run: dotnet build Nguon/tests/PersonalInfoManager.SecurityRegression.csproj --configuration Release

      - name: Run GL-13 with synthetic data (30 testcases)
        shell: pwsh
        env:
          TQLTK_GL13_JUNCTION_TEST: '1'
        run: |
          $testRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [System.IO.Directory]::Exists($testRoot)) { throw 'RUNNER_TEMP is unavailable.' }
          $env:TEMP = $testRoot
          $env:TMP = $testRoot
          $report = Join-Path $testRoot 'gl13-report.xml'
          dotnet run --no-build --project Nguon/tests/PersonalInfoManager.SecurityRegression.csproj --configuration Release -- --gl13 $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content -LiteralPath $report -Raw
          if ($results.DocumentElement.LocalName -ne 'testsuite' -or @($results.DocumentElement.Attributes | Where-Object { $_.LocalName -notin @('name','tests','failures','skipped') }).Count -ne 0 -or @($results.DocumentElement.ChildNodes | Where-Object { $_.LocalName -ne 'testcase' }).Count -ne 0) { throw 'Unexpected JUnit structure.' }
          $cases = @($results.testsuite.testcase)
          $requiredCases = @('junction-detection-cleanup', 'migration-product-junction-guard', 'migration-stale-observation-existing-destination', 'migration-child-after-move-retry', 'vault-backup-move-failure-retry', 'vault-backup-destination-collision', 'vault-backup-between-moves-interruption')
          if ($results.testsuite.name -ne 'TQLTK.Windows.GL13' -or $cases.Count -ne 30 -or @($requiredCases | Where-Object { $required = $_; @($cases | Where-Object { $_.name -eq $required }).Count -ne 1 }).Count -ne 0 -or [int]$results.testsuite.tests -ne $cases.Count -or [int]$results.testsuite.failures -ne 0 -or [int]$results.testsuite.skipped -ne 0) { throw 'Invalid or unsuccessful GL-13 report.' }
          foreach ($case in $cases) {
            if ($case.classname -ne 'TQLTK.Windows.GL13' -or $case.name -notmatch '^[a-z0-9-]+$' -or $case.ChildNodes.Count -ne 0 -or @($case.Attributes | Where-Object { $_.LocalName -notin @('name','classname') }).Count -ne 0) { throw 'Unexpected JUnit content.' }
          }

      - name: Upload GL-13 JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl13-isolated-junit
          path: ${{ runner.temp }}/gl13-report.xml
          if-no-files-found: error

  backup-transfer-producer:
    runs-on: windows-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Export synthetic portable and legacy fixtures
        shell: pwsh
        run: ./ci/run-windows-security.ps1 -BackupLabMode transfer-export -LabPath "$env:RUNNER_TEMP/transfer-fixtures"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-backup-transfer
          path: |
            ${{ runner.temp }}/transfer-fixtures/complete.tqltk
            ${{ runner.temp }}/transfer-fixtures/legacy-v3p.vault
            ${{ runner.temp }}/transfer-fixtures/machine-bound.txt
            ${{ runner.temp }}/transfer-fixtures/producer.json
          retention-days: 1
          if-no-files-found: error

  backup-transfer-consumer:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: backup-transfer-producer
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-backup-transfer
          path: ${{ runner.temp }}/transfer-fixtures
      - name: Restore on a different Windows machine and SID
        shell: pwsh
        run: ./ci/run-windows-security.ps1 -BackupLabMode transfer-import -LabPath "$env:RUNNER_TEMP/transfer-fixtures"

  backup-disk-full:
    runs-on: windows-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Real disk-full backup test on a bounded virtual disk
        shell: pwsh
        run: ./ci/run-disk-full-lab.ps1
